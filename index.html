
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Bulb and Window Print</title>
    <style>
        body {
            background-color: #111827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        
        }
        h2 {
            color: blue;
            margin-top:30px;

        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            margin: 15px 8px;
            padding: 12px 22px;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #38bdf8;
            transform: scale(1.05);
        }
        img {
            display: block;
            margin-top: 20px auto;
            width: 100px;
        }
        </style>
</head>
<body>

    <h2>What can JavaScript do?</h2>

    <p>JavaScript can change HTML attribute values.</p>

    <p>JavaScript can change the source of an image.</p>

    <button onclick="document.getElementById('myImage').src='https://www.w3schools.com/js/pic_bulbon.gif'">
        Turn on the light
    </button>

    <img
        id="myImage"
        src="https://www.w3schools.com/js/pic_bulboff.gif"
        style="width:100px"
        alt="Light bulb"
    >

    <button onclick="document.getElementById('myImage').src='https://www.w3schools.com/js/pic_bulboff.gif'">
        Turn off the light
    </button>

    <!-- Window Print Example -->
    <h2>JavaScript Window Print</h2>

    <p>Click the button below to print this page.</p>

    <button onclick="window.print()">Print this page</button>

</body>
</html>
